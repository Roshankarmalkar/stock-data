name: Update fundamentals
on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python fetch_fundamentals.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add fundamentals.json
          git diff --cached --quiet || (git commit -m "daily data" && git push)
